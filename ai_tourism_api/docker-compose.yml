version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - audio_cache:/srv/app/storage/audio_cache
    depends_on:
      - db

  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: tourism
      POSTGRES_PASSWORD: tourism
      POSTGRES_DB: tourism
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  audio_cache:
